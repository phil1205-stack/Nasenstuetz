<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasenstütz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nasenstütz">
<meta name="theme-color" content="#10161E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: freundliches Trainingsbuch. Warme Morgen-Karte für "Heute", farbige Kacheln je Übung, eigene Figuren-Zeichnungen.
   Jede Übung hat ihre Farbe wie Hallenmarkierungen. Training läuft als Vollbild-Ablauf. */
:root {
  --bg: #F3F6FA; --surface: #FFFFFF; --sunk: #E8EDF3; --ink: #18222E; --muted: #5E6A7A; --line: #DFE5EC;
  --c-push: #F05A24; --c-squat: #1F7FD6; --c-situp: #E0A100; --c-plank: #7353E0; --c-stretch: #16A06C; --c-band: #DB3A72; --c-free: #4A5868; --c-mil: #5E7424;
  --hero-a: #FF8A3D; --hero-b: #FF5A6E; --hero-ink: #FFFFFF;
  --good: #16A06C; --on-color: #FFFFFF; --figure: #18222E;
  --shadow: 0 1px 2px rgba(24, 40, 70, .06), 0 6px 18px rgba(24, 40, 70, .07);
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #131B2A; --surface: #1D2739; --sunk: #172031; --ink: #EEF2F8; --muted: #9AA7BA; --line: #2B3850;
  --c-push: #FF7A45; --c-squat: #5AAEFF; --c-situp: #FFCB45; --c-plank: #A48CFF; --c-stretch: #43D39A; --c-band: #FF6FA0; --c-free: #B4C1D2; --c-mil: #A9C45A;
  --hero-a: #F0713A; --hero-b: #E2456A; --hero-ink: #FFFFFF;
  --good: #43D39A; --on-color: #131B2A; --figure: #EEF2F8; --shadow: none; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #131B2A; --surface: #1D2739; --sunk: #172031; --ink: #EEF2F8; --muted: #9AA7BA; --line: #2B3850;
    --c-push: #FF7A45; --c-squat: #5AAEFF; --c-situp: #FFCB45; --c-plank: #A48CFF; --c-stretch: #43D39A; --c-band: #FF6FA0; --c-free: #B4C1D2; --c-mil: #A9C45A;
    --hero-a: #F0713A; --hero-b: #E2456A; --hero-ink: #FFFFFF;
    --good: #43D39A; --on-color: #131B2A; --figure: #EEF2F8; --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 36px) max(16px, env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
main { max-width: 480px; margin: 0 auto; display: grid; gap: 26px; }
h1, h2, h3 { margin: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 24px; font-weight: 800; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--c-squat); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); }

header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); display: grid; place-content: center; }

/* Wochenleiste */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; padding: 8px 0 9px; border-radius: 12px; }
.wd .d { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.wd .n { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1; }
.wd .m { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid transparent; }
.wd.plan .m { border-color: var(--muted); }
.wd.done .m { background: var(--good); border-color: var(--good); }
.wd.today { background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); }
.wd.today .d { color: var(--hero-ink); opacity: .85; }
.wd.today.plan .m { border-color: var(--hero-ink); }
.wd.today.done .m { background: var(--hero-ink); border-color: var(--hero-ink); }

/* Heute */
.today-card { overflow: hidden; display: grid; }
.today-top { background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); padding: 16px 18px 18px; display: grid; gap: 4px; }
.today-top .label { color: var(--hero-ink); opacity: .85; }
.today-body { padding: 16px 18px 18px; display: grid; gap: 14px; }
.blocks { display: grid; gap: 10px; }
.block { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; }
.ill { border-radius: 14px; display: grid; place-content: center; background: color-mix(in srgb, var(--k) 14%, var(--surface)); }
.ill svg { display: block; }
.block .name { font-weight: 600; }
.reps { display: flex; flex-wrap: wrap; gap: 2px 9px; font-family: var(--display); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.reps .x { color: var(--muted); font-weight: 500; }
.go { width: 100%; padding: 17px; border-radius: 14px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); font-family: var(--display); font-weight: 800; font-size: 23px; letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 6px 16px color-mix(in srgb, var(--hero-b) 30%, transparent); }
.go.alt { background: var(--sunk); color: var(--ink); font-size: 18px; padding: 13px; box-shadow: none; }
.done-note { display: flex; gap: 10px; align-items: center; color: var(--good); font-weight: 600; }

/* Kacheln */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; border-radius: 16px; padding: 12px 12px 14px; display: grid; gap: 4px; align-content: start; background: color-mix(in srgb, var(--k) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k) 22%, transparent); }
.tile .ill { background: transparent; place-content: start; }
.tile b { font-family: var(--display); font-size: 19px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; color: var(--ink); }
.tile .label { color: color-mix(in srgb, var(--k) 70%, var(--ink)); }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tiles.four .tile { padding: 8px 6px 10px; justify-items: center; text-align: center; }
.tiles.four .tile b { font-size: 13px; letter-spacing: 0; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.tiles.four .tile .ill { place-content: center; }

/* Fortschritt */
.prog { display: grid; overflow: hidden; }
.prow { display: grid; grid-template-columns: 1fr auto 92px; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .lvl { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.prow .delta { font-size: 12px; color: var(--good); font-weight: 600; }
.spark { width: 92px; height: 30px; }

/* Einstellungen & Formulare */
details.box { padding: 14px; }
details.box summary { cursor: pointer; font-weight: 600; }
.fieldset { display: grid; gap: 10px; margin-top: 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.opt[aria-checked="true"] { border-color: var(--hero-b); background: color-mix(in srgb, var(--hero-b) 7%, var(--surface)); }
.opt .r { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 2px; }
.opt[aria-checked="true"] .r { border: 6px solid var(--hero-b); }
.opt b { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row input[type=number], .row select, .row input[type=time] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.row input[type=number] { width: 84px; text-align: right; }
.row input[type=range] { width: 150px; accent-color: var(--hero-b); }
.linkbtn { color: var(--muted); text-decoration: underline; font-size: 13px; padding: 0; justify-self: start; }

/* Einstufung */
.setup { display: grid; gap: 18px; }
.intro { display: grid; gap: 8px; }
.intro h2 { font-size: 34px; line-height: 1; }
.pad { padding: 16px 18px 18px; display: grid; gap: 14px; }
.test-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.test-row:last-child { border-bottom: 0; }
.test-row .ctl { display: flex; gap: 6px; align-items: center; }
.test-row input { width: 64px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: right; }
.btn-s { padding: 8px 12px; border-radius: 8px; background: var(--sunk); font-weight: 600; font-size: 13px; }

/* Ablauf (Vollbild) */
#run {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); touch-action: manipulation; user-select: none; -webkit-user-select: none;
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
}
#run .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#run .track { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
#run .track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--hero-a), var(--hero-b)); transition: width .3s; }
.stage { display: grid; align-content: center; justify-items: center; text-align: center; gap: 10px; min-height: 0; overflow-y: auto; }
.stage .what { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.stage .big { font-family: var(--display); font-weight: 800; font-size: min(36vw, 240px); line-height: .85; font-variant-numeric: tabular-nums; }
.stage .big.mid { font-size: min(24vw, 150px); }
.stage .big.pop { animation: pop .18s ease-out; }
.stage .goal { font-size: 16px; font-weight: 600; }
.stage .cue { max-width: 36ch; color: var(--muted); font-size: 14px; }
.stage .status { min-height: 22px; color: var(--muted); }
.stage .ill { width: min(300px, 100%); padding: 6px 10px; }
.stage .ill svg { width: 100%; height: auto; }
.stage .ill.sm { width: min(170px, 60%); }
@keyframes pop { from { transform: scale(1.08); } to { transform: scale(1); } }
.meter { width: min(320px, 100%); display: grid; gap: 6px; }
.meter .t { position: relative; height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.meter .f { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .08s linear; }
.meter .th { position: absolute; top: 0; bottom: 0; width: 3px; left: 50%; background: var(--ink); }
.meter .c { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 10px; }
.actions button { flex: 1; padding: 15px; border-radius: 13px; font-weight: 700; font-size: 16px; background: var(--surface); border: 1px solid var(--line); }
.actions button.main { color: var(--on-color); border-color: transparent; font-family: var(--display); font-size: 21px; letter-spacing: .05em; text-transform: uppercase; }
.feel { display: grid; gap: 10px; width: min(360px, 100%); }
.feel button { padding: 14px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; text-align: left; box-shadow: var(--shadow); }
.feel button small { display: block; color: var(--muted); font-weight: 400; }
.summary { width: min(360px, 100%); display: grid; gap: 8px; text-align: left; }
.summary div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.btn-x { padding: 8px 12px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.builder { width: min(380px, 100%); display: grid; gap: 8px; text-align: left; }
.brow { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); }
.brow.on { border-color: var(--k); background: color-mix(in srgb, var(--k) 8%, var(--surface)); }
.brow .ctl { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.brow input, .brow select { width: 58px; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: right; }

/* Statistik */
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; border-radius: 12px; }
.seg button { padding: 8px 2px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-selected="true"] { background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; background: color-mix(in srgb, var(--k, var(--muted)) 11%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k, var(--muted)) 20%, transparent); }
.kpi b { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; color: color-mix(in srgb, var(--k, var(--ink)) 85%, var(--ink)); }
.kpi span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.chart { padding: 12px 12px 8px; display: grid; gap: 6px; }
.cols { display: grid; gap: 3px; align-items: end; height: 120px; }
.cols .c { display: flex; flex-direction: column-reverse; height: 100%; min-width: 0; }
.cols .c i { display: block; width: 100%; }
.cols .c i:last-child { border-radius: 4px 4px 0 0; }
.cols .c.empty::before { content: ""; display: block; height: 2px; background: var(--line); }
.xl { display: grid; gap: 3px; font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--k); }
.streak { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.streak .flame { width: 52px; height: 52px; border-radius: 14px; display: grid; place-content: center; font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--hero-ink); background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); font-variant-numeric: tabular-nums; }
.flex-in { display: flex; gap: 8px; align-items: center; }
.flex-in input { width: 76px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: right; }
.lvl-card { gap: 10px; background: linear-gradient(135deg, color-mix(in srgb, var(--hero-a) 14%, var(--surface)), color-mix(in srgb, var(--hero-b) 14%, var(--surface))); }
.xp { font-family: var(--display); font-size: 28px; font-weight: 800; text-align: right; line-height: 1; }
.xp small { font-size: 13px; color: var(--muted); font-weight: 600; }
.xpbar { height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.xpbar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--hero-a), var(--hero-b)); }
.bgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bdg { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 10px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.bdg b { font-size: 13px; line-height: 1.2; }
.bdg span { font-size: 11px; color: var(--muted); line-height: 1.3; }
.bdg:not(.got) svg { opacity: .9; }
.unlock { display: grid; justify-items: center; gap: 6px; animation: rise .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes rise { from { transform: scale(.3) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .unlock { animation: none; } }
.daily { border-color: color-mix(in srgb, var(--k) 35%, var(--line)); }
.recs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rec { display: grid; gap: 3px; }
.rec i { display: block; height: 6px; border-radius: 3px; }
.rec b { font-size: 13px; }
.rec span { font-size: 12px; color: var(--muted); }
.joker { font-size: 15px; letter-spacing: 2px; }
#fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .stage .big.pop { animation: none; } #run .track i { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="run" hidden>
  <div class="bar"><button class="btn-x" id="rQuit">Beenden</button><span class="label" id="rTitle"></span><span class="label" id="rStep"></span></div>
  <div class="track"><i id="rTrack"></i></div>
  <div class="stage" id="rStage"></div>
  <div class="actions" id="rActions"></div>
</div>
<canvas id="fx" hidden></canvas>

<script>
(function () {
"use strict";

/* ===================== Inhalte ===================== */
const APP_NAME = "Nasenstütz";
const EX = {
  push:  { name: "Liegestütze", tag: "LS", pose: "push", color: "--c-push",  mode: "tap",   unit: "",  f: [.5, .6, .5, .5, .6], step: 1,
           cue: "Körper bildet eine gerade Linie, Ellbogen etwa 45 Grad vom Körper. Handy unter die Brust, gern erhöht auf ein Buch, und bei jeder Wiederholung mit der Nase antippen.",
           testQ: "Wie viele saubere Liegestütze schaffst du am Stück?" },
  squat: { name: "Squats",      tag: "SQ", pose: "squat", color: "--c-squat", mode: "lift",  unit: "",  f: [.6, .7, .6, .7],     step: 1,
           cue: "Handy vor der Brust halten. Füße schulterbreit, Knie folgen den Zehen, Gewicht auf den Fersen. Mindestens bis die Oberschenkel waagerecht sind.",
           testQ: "Wie viele Kniebeugen schaffst du am Stück?" },
  situp: { name: "Situps",      tag: "SU", pose: "situp", color: "--c-situp", mode: "tilt",  unit: "",  f: [.6, .7, .6, .7],     step: 1,
           cue: "Handy flach auf die Brust, Arme darüber verschränken. Füße am Boden, Kinn leicht zur Brust, langsam wieder abrollen.",
           testQ: "Wie viele Situps schaffst du am Stück?" },
  plank: { name: "Plank",       tag: "PL", pose: "plank", color: "--c-plank", mode: "timer", unit: "s", f: [.6, .7, .8],         step: 3,
           cue: "Ellbogen unter den Schultern, Bauch und Po fest, Hüfte weder hängen lassen noch hochschieben. Ruhig weiteratmen.",
           testQ: "Wie viele Sekunden hältst du den Plank?" }
};
const EX_ORDER = ["push", "squat", "situp", "plank"];

const CYCLES = {
  full:  { name: "Ganzkörper", desc: "Alle vier Übungen an 3 festen Tagen pro Woche. Dazwischen erholt sich der Körper.", days: true },
  split: { name: "Zwei Hälften", desc: "Abwechselnd Liegestütze mit Plank und Squats mit Situps, an 4 Tagen. Kürzere Einheiten.", days: true },
  daily: { name: "Jeden Tag kurz", desc: "Täglich zwei Übungen im Wechsel, mit etwas weniger Wiederholungen. Gut für die Routine.", days: false }
};
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

const ROUTINES = {

      vx: big ? (fromSide ? -1 : 1) * (4 + Math.random() * 9) : (Math.random() - .5) * 12, vy: -(big ? 9 + Math.random() * 10 : 5 + Math.random() * 9),

function spark(hist, color) {
  const pts = hist.slice(-20);

  const vals = pts.map(p => p[1]), lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const xy = vals.map((v, i) => [2 + i * 88 / (vals.length - 1), 26 - (v - lo) / r * 22]);
  const line = xy.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 92 30" aria-hidden="true"><polyline points="2,28 ${line} 90,28" fill="${cv(color)}" fill-opacity=".14" stroke="none"/><polyline points="${line}" fill="none" stroke="${cv(color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${cv(color)}"/></svg>`;
}

/* ===================== Abläufe bauen ===================== */
function planSteps(ex, steps) {
  if (testDue(ex)) { steps.push({ k: "set", ex, test: true, target: 0, last: true, idx: 1, of: 1 }); return; }
  const t = targets(ex), variant = ex === "push" ? pushVariant() : null;
  t.forEach((v, i) => {
    steps.push({ k: "set", ex, target: v, last: i === t.length - 1, idx: i + 1, of: t.length, variant });
    if (i < t.length - 1) steps.push({ k: "rest", sec: restFor(i + 1, t.length), next: EX[ex].name + " · Satz " + (i + 2) });
  });
  steps.push({ k: "feel", ex, targets: t });
}
function startToday() {
  const exs = exercisesFor(new Date()), steps = [];
  exs.forEach((ex, bi) => {
    planSteps(ex, steps);
    if (bi < exs.length - 1) steps.push({ k: "rest", sec: 90, next: EX[exs[bi + 1]].name });
  });
  steps.push({ k: "done" });
  startRun("Plan-Training", steps, { kind: "plan" });
}

function startRoutine(id) {
  const r = ROUTINES[id], steps = [];
  if (r.kind === "milt") {
    for (let round = 1; round <= r.rounds; round++) r.items.forEach(([n, cue], i) => {
      steps.push({ k: "timed", name: n, cue, sec: r.work, color: r.color, pose: POSE_OF[n], prep: 0, work: true, round, rounds: r.rounds });
      const last = round === r.rounds && i === r.items.length - 1;
      if (!last) steps.push({ k: "rest", sec: i === r.items.length - 1 ? 60 : r.rest, next: i === r.items.length - 1 ? "Runde " + (round + 1) : r.items[i + 1][0] });
    });
  } else if (r.kind === "stretch") {
    r.items.forEach(([n, cue, sec, sides]) => {
      const pose = POSE_OF[n];
      if (sides) { steps.push({ k: "timed", name: n + " · links", cue, sec, color: r.color, pose }); steps.push({ k: "timed", name: n + " · rechts", cue, sec, color: r.color, pose }); }
      else steps.push({ k: "timed", name: n, cue, sec, color: r.color, pose });
    });
  } else {
    for (let round = 1; round <= r.rounds; round++) {
      r.items.forEach(([n, cue, reps], i) => {
        steps.push({ k: "reps", name: n, cue, reps, color: r.color, round, rounds: r.rounds, pose: POSE_OF[n] });
        if (i < r.items.length - 1) steps.push({ k: "rest", sec: 20, next: r.items[i + 1][0] });
      });
      if (round < r.rounds) steps.push({ k: "rest", sec: 60, next: "Runde " + (round + 1) });
    }
  }
  steps.push({ k: "done" });
  startRun(r.name, steps, { kind: "routine", id, min: r.min });
}
function startFree() {

  startRun("Einzelner Satz", steps, { kind: "free" });

/* ===================== Ablauf-Motor ===================== */
let R = null;
let audio = null, wakeLock = null, timers = [];
function beep(freq, len, vol) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o = audio.createOscillator(), g = audio.createGain(), l = len || .12;
    o.frequency.value = freq || 880; g.gain.setValueAtTime(vol || .2, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + l);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + l + .01);
  } catch (e) {}
}
async function keepAwake() { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (R && document.visibilityState === "visible") keepAwake(); });
function clearTimers() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; }

async function needMotion(steps) {
  if (!steps.some(s => s.k === "set" && (EX[s.ex].mode === "lift" || EX[s.ex].mode === "tilt")) && !steps.some(s => s.k === "pick" || s.k === "build")) return true;
  if (typeof DeviceMotionEvent === "undefined") return true;
  if (typeof DeviceMotionEvent.requestPermission === "function") {
    try { const r = await DeviceMotionEvent.requestPermission(); return r === "granted" ? true : "denied"; }
    catch (e) { return "denied"; }
  }
  return true;
}

async function startRun(title, steps, meta) {
  const perm = await needMotion(steps);
  beep(880, .04, .05);
  R = { title, steps, i: 0, meta, res: {}, motionOK: perm === true };
  if (perm === true) window.addEventListener("devicemotion", onMotion);
  $("#rTitle").textContent = title;
  $("#run").hidden = false; document.body.style.overflow = "hidden";
  keepAwake();
  go(0);
}
function endRun(saveIt) {
  clearTimers(); stopMotion(); window.removeEventListener("devicemotion", onMotion);
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  if (saveIt !== false) commit(false);
  R = null; $("#run").hidden = true; document.body.style.overflow = ""; forceToday = false; render();
}
$("#rQuit").addEventListener("click", () => {
  if (!R) return;
  if (R.confirmQuit) { endRun(); return; }
  R.confirmQuit = true; $("#rQuit").textContent = "Wirklich?";
  timers.push(setTimeout(() => { if (R) { R.confirmQuit = false; $("#rQuit").textContent = "Beenden"; } }, 2500));
});

function commit(finished) {
  if (!R || R.committed) return;
  const k = todayKey(), m = R.meta;
  if (m.kind === "plan") {
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "plan", sets: r.sets.slice(), test: !!r.test, variant: r.variant });
  } else if (m.kind === "single") {
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "single", sets: r.sets.slice(), test: !!r.test });
  } else if (m.kind === "miltest") {
    const pu = R.res.push ? R.res.push.sets[0] || 0 : 0, su = R.res.situp ? R.res.situp.sets[0] || 0 : 0;
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "mil", sets: r.sets.slice() });
    if (pu || su) { S.mil = S.mil || []; S.mil.push([k, pu, su]); }
  } else if (m.kind === "mini") {
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "mini", sets: r.sets.slice() });
  } else if (m.kind === "free") {
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "free", sets: r.sets.slice() });
  } else if (m.kind === "routine" && (finished || R.i > 2)) {
    logAdd(k, { type: m.id, mode: "routine", min: m.min });
  }
  R.committed = true; save();
}

function go(i) {
  clearTimers(); stopMotion();
  R.i = i; R.confirmQuit = false; $("#rQuit").textContent = "Beenden";
  const s = R.steps[i], total = R.steps.length;
  $("#rStep").textContent = (i + 1) + " / " + total;
  $("#rTrack").style.width = (i / Math.max(1, total - 1) * 100) + "%";
  const st = $("#rStage"), ac = $("#rActions");
  st.innerHTML = ""; ac.innerHTML = ""; st.onpointerdown = null;
  ({ set: stepSet, rest: stepRest, timed: stepTimed, reps: stepReps, feel: stepFeel, done: stepDone, pick: stepPick, build: stepBuild })[s.k](s, st, ac);
}
const next = () => { if (R) go(R.i + 1); };

function el(tag, cls, text, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (style) e.style.cssText = style; return e; }
function btn(text, cls, fn, color) { const b = el("button", cls || "", text); if (color) b.style.background = cv(color); b.addEventListener("click", fn); return b; }
function countdown(sec, statusEl, done) {
  let s = sec; statusEl.textContent = "Los in " + s + " …"; beep(600, .08);
  const t = setInterval(() => { s--; if (s > 0) { statusEl.textContent = "Los in " + s + " …"; beep(600, .08); } else { clearInterval(t); beep(1000, .2); done(); } }, 1000);
  timers.push(t);
}

/* ---------- Satz ---------- */
function stepSet(s, st, ac) {
  const D = EX[s.ex], col = D.color;
  let count = 0, armed = false, lastTap = 0, finished = false;
  const V = s.variant ? PUSH_VAR[s.variant] : null;
  const ill = document.createElement("div"); ill.innerHTML = illo(D.pose, col, 170, "sm"); st.append(ill.firstChild);
  st.append(el("div", "what", D.name + (V && s.variant !== "normal" ? " " + V.name : "") + (s.test ? " · Test" : s.of > 1 ? " · Satz " + s.idx + "/" + s.of : ""), `color:${cv(col)}`));
  const big = el("div", "big", D.unit === "s" ? "0s" : "0", `color:${cv(col)}`); st.append(big);
  const goal = el("div", "goal", s.test ? (D.unit === "s" ? "So lange wie möglich halten" : "So viele wie sauber gehen") : !s.target ? "Ohne Ziel, einfach los" : (s.last ?"Mindestens " + fmt(s.ex, s.target) + ", gern mehr" : "Ziel " + fmt(s.ex, s.target)));
  st.append(goal);
  const status = el("div", "status"); st.append(status);
  let meterFill = null;
  if ((D.mode === "lift" || D.mode === "tilt") && R.motionOK) {
    const m = el("div", "meter"); m.innerHTML = '<div class="t"><div class="f"></div><div class="th"></div></div><div class="c"><span>Bewegung</span><span>Zählschwelle</span></div>';
    meterFill = m.querySelector(".f"); meterFill.style.background = cv(col); st.append(m);
  }
  st.append(el("div", "cue", (V && s.variant !== "normal" ? V.cue + " " : "") + D.cue));

  const set = (v, pop) => {
    count = Math.max(0, v); big.textContent = fmt(s.ex, count);
    if (pop) { big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop"); }
    if (!s.last && !s.test && count >= s.target && D.mode !== "timer" && !finished) { finished = true; beep(1300, .25); status.textContent = "Geschafft"; timers.push(setTimeout(finish, 1200)); }
  };
  const finish = () => {
    if (!R) return;
    const r = R.res[s.ex] = R.res[s.ex] || { sets: [] };
    if (s.test) {
      r.test = true; r.sets.push(count);
      if (R.meta.kind === "setup") { S.draft[s.ex] = String(count); save(); }
      else if (count > 0) { applyTest(s.ex, count); save(); }
    } else r.sets.push(count);
    if (s.variant) r.variant = s.variant;
    if (R.meta.kind === "setup") { S.tested[s.ex] = true; save(); }
    if (R.meta.kind === "setup") { endRun(false); return; }
    next();
  };
  let limitStarted = false;
  const startLimit = () => {
    if (!s.limit || limitStarted) return; limitStarted = true;
    let left = s.limit; goal.textContent = "Noch " + left + " s";
    timers.push(setInterval(() => { left--; goal.textContent = "Noch " + left + " s"; if (left <= 5 && left > 0) beep(600, .06); if (left <= 0) { beep(1200, .5); finish(); } }, 1000));
  };
  if (s.limit) goal.textContent = "2 Minuten, so viele wie sauber gehen";
  const minus = btn("−1", "", () => { finished = false; set(count - 1); });
  const done = btn(s.last || s.test ? "Fertig" : "Satz fertig", "main", finish, col);

  if (D.mode === "tap" || ((D.mode === "lift" || D.mode === "tilt") && !R.motionOK)) {
    armed = true;
    status.textContent = D.mode === "tap" ? "Tippen zählt. Der ganze Bildschirm ist Zählfläche." : "Bewegungssensor nicht erlaubt. Tippe pro Wiederholung irgendwo auf den Bildschirm.";
    st.onpointerdown = e => { if (!armed) return; const n = Date.now(); if (n - lastTap < 500) return; lastTap = n; set(count + 1, true); beep(); };
    ac.append(minus, done);
    if (s.limit) { armed = false; countdown(3, status, () => { armed = true; status.textContent = "Los! Tippen zählt."; startLimit(); }); }
  } else if (D.mode === "timer") {
    ac.append(done);
    countdown(3, status, () => {
      const t0 = Date.now(); let beeped = false; status.textContent = "Halten";
      timers.push(setInterval(() => {
        set(Math.floor((Date.now() - t0) / 1000));
        if (!s.test && !beeped && count >= s.target) { beeped = true; beep(1300, .4); status.textContent = s.last ? "Ziel erreicht. Halte weiter, solange es sauber geht." : "Geschafft"; if (!s.last) timers.push(setTimeout(finish, 800)); }
      }, 250));
    });
  } else {
    ac.append(minus, done);
    startMotion(D.mode, S.prog[s.ex].sens, meterFill, () => { set(count + 1, true); beep(); });
    countdown(D.mode === "tilt" ? 5 : 3, status, () => { motionArm(); startLimit(); status.textContent = D.mode === "lift" ? "Zählt jede Kniebeuge" : "Zählt jedes Aufrichten"; });
    timers.push(setTimeout(() => { if (sm && !sm.seen) status.textContent = "Kein Sensorsignal. Zähle mit −1 / Tippen nach oder prüfe die Freigabe in Safari."; }, 6000));
    st.onpointerdown = e => { if (sm && !sm.seen) { const n = Date.now(); if (n - lastTap < 500) return; lastTap = n; set(count + 1, true); beep(); } };
  }
}

/* ---------- Pause ---------- */
function stepRest(s, st, ac) {
  let left = s.sec;
  st.append(el("div", "what", "Pause"));
  const big = el("div", "big", String(left)); st.append(big);
  st.append(el("div", "goal", "Als Nächstes: " + s.next));
  st.append(el("div", "cue", "Locker ausschütteln und ruhig atmen."));
  const tick = () => {
    left--; big.textContent = String(Math.max(0, left));
    if (left <= 3 && left > 0) beep(600, .08);
    if (left <= 0) { beep(1000, .2); next(); }
  };
  timers.push(setInterval(tick, 1000));
  ac.append(btn("+15 s", "", () => { left += 15; big.textContent = String(left); }), btn("Weiter", "main", next, "--c-free"));
}

/* ---------- Dehnen (Zeit) ---------- */
function stepTimed(s, st, ac) {
  let left = s.sec, started = false;
  if (s.pose) { const ill = document.createElement("div"); ill.innerHTML = illo(s.pose, s.color, 300); st.append(ill.firstChild); }
  st.append(el("div", "what", s.name, `color:${cv(s.color)}`));
  const big = el("div", "big mid", String(left), `color:${cv(s.color)}`); st.append(big);
  st.append(el("div", "cue", s.cue));
  const status = el("div", "status", "Einnehmen …"); st.append(status);
  const run = () => {
    started = true; if (!s.work) status.textContent = "Halten, bis es angenehm zieht, nicht schmerzt."; else beep(1000, .15);
    timers.push(setInterval(() => { left--; big.textContent = String(Math.max(0, left)); if (left <= 3 && left > 0) beep(600, .06); if (left <= 0) { beep(1000, .2); next(); } }, 1000));
  };
  if (s.work) status.textContent = "Runde " + s.round + " von " + s.rounds + " · Vollgas, sauber bleiben";
  timers.push(setTimeout(run, s.prep != null ? s.prep : 4000));
  ac.append(btn("Pause", "", e => {
    if (!started) return;
    if (e.target.dataset.p) { delete e.target.dataset.p; e.target.textContent = "Pause"; run(); }
    else { clearTimers(); e.target.dataset.p = "1"; e.target.textContent = "Weiter"; status.textContent = "Pausiert"; }
  }), btn("Überspringen", "main", next, s.color));
}

/* ---------- Band (Wiederholungen) ---------- */
function stepReps(s, st, ac) {
  if (s.pose) { const ill = document.createElement("div"); ill.innerHTML = illo(s.pose, s.color, 300); st.append(ill.firstChild); }
  st.append(el("div", "what", s.name, `color:${cv(s.color)}`));
  st.append(el("div", "big mid", String(s.reps), `color:${cv(s.color)}`));
  st.append(el("div", "goal", "Wiederholungen · Runde " + s.round + " von " + s.rounds));
  st.append(el("div", "cue", s.cue + " Langsam zurück, 2 Sekunden."));
  ac.append(btn("Erledigt", "main", () => { beep(1000, .12); next(); }, s.color));
}

/* ---------- Gefühl ---------- */
function stepFeel(s, st, ac) {
  const r = R.res[s.ex] || { sets: [] }, D = EX[s.ex];
  st.append(el("div", "what", D.name + " geschafft", `color:${cv(D.color)}`));
  st.append(el("div", "goal", r.sets.map(v => fmt(s.ex, v)).join(" · ") || "Keine Sätze gezählt"));
  const met = r.sets.length === s.targets.length && r.sets.every((v, i) => v >= s.targets[i]);
  st.append(el("div", "cue", met ? "Alle Ziele erreicht. Wie hat es sich angefühlt?" : "Nicht alle Ziele erreicht, das ist normal. Der Plan bleibt erstmal auf dieser Stufe."));
  const box = el("div", "feel");
  const pick = feel => { applyProgress(s.ex, r.sets, s.targets, feel); save(); next(); };
  if (met) {
    celebrate(false);
    [["easy", "Leicht", "Nächstes Mal deutlich mehr"], ["ok", "Passend", "Normal steigern"], ["hard", "Grenzwertig", "Nur ein kleines Stück mehr"]].forEach(([f, t, sub]) => {
      const b = el("button"); b.append(el("span", "", t), el("small", "", sub)); b.addEventListener("click", () => pick(f)); box.append(b);
    });
  } else { const b = el("button"); b.append(el("span", "", "Weiter"), el("small", "", "Stufe halten und beim nächsten Mal erneut versuchen")); b.addEventListener("click", () => pick("ok")); box.append(b); }
  st.append(box);
}

/* ---------- Fertig ---------- */
function stepDone(s, st, ac) {
  commit(true);
  $("#rTrack").style.width = "100%";
  if (R.meta.kind !== "free") celebrate(true);
  beep(880, .1); timers.push(setTimeout(() => beep(1320, .25), 120));
  st.append(el("div", "what", "Fertig"));
  if (R.meta.kind === "mini") st.append(el("div", "goal", "Tag gerettet. Die Woche zählt."));
  st.append(el("div", "big", "✓", "color:var(--good);font-size:min(30vw,180px)"));
  const sum = el("div", "summary");
  for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) {
    const row = el("div"); row.append(el("span", "", EX[ex].name + (r.test ? " (Test)" : "")), el("b", "num", r.sets.map(v => fmt(ex, v)).join(" · "), `color:${cv(EX[ex].color)}`)); sum.append(row);
  }
  if (R.meta.kind === "routine") { const row = el("div"); row.append(el("span", "", R.title), el("b", "", R.meta.min + " Min")); sum.append(row); }
  st.append(sum);
  const ach = newAchievements();
  if (ach.level) { const u = el("div", "unlock"); u.append(el("div", "label", "Level-Aufstieg"), el("div", "what", "Level " + ach.level.n + " · " + ach.level.name, "color:var(--hero-b)")); st.append(u); }
  if (ach.badges.length) {
    const u = el("div", "unlock"); u.append(el("div", "label", ach.badges.length === 1 ? "Neues Abzeichen" : ach.badges.length + " neue Abzeichen"));
    const row = el("div", "", null, "display:flex;gap:10px;flex-wrap:wrap;justify-content:center");
    ach.badges.slice(0, 4).forEach(b => { const d = el("div", "bdg got", null, "width:104px"); d.innerHTML = medal(b, 56); d.append(el("b", "", b.name)); row.append(d); });
    u.append(row); st.append(u);
    timers.push(setTimeout(() => celebrate(true), 900));
  }
  if (R.meta.kind === "plan") st.append(el("div", "cue", "Dein nächstes Training ist schon neu berechnet. Dehnen hilft jetzt beim Runterkommen."));
  ac.append(btn("Schließen", "main", () => endRun(), "--c-free"));
}

/* ---------- Übung wählen (freier Satz) ---------- */
function stepPick(s, st, ac) {
  st.append(el("div", "what", "Welche Übung?"));
  const box = el("div", "feel");
  EX_ORDER.forEach(ex => {
    const b = el("button"); b.append(el("span", "", EX[ex].name), el("small", "", ({ tap: "Zählt per Nasentipp", lift: "Zählt über den Bewegungssensor", tilt: "Zählt über den Bewegungssensor", timer: "Läuft als Stoppuhr" })[EX[ex].mode]));
    b.style.borderLeft = "6px solid " + cv(EX[ex].color);
    b.addEventListener("click", () => { R.steps.splice(R.i + 1, 0, { k: "set", ex, target: 0, last: true, idx: 1, of: 1 }, { k: "done" }); R.steps.length = R.i + 3; next(); });
    box.append(b);
  });
  st.append(box);
}

/* ---------- Eigenes Training zusammenstellen ---------- */
function stepBuild(s, st, ac) {
  st.style.alignContent = "start";
  st.append(el("div", "what", "Eigenes Training"));
  st.append(el("div", "cue", "Wähle Übungen, Sätze und Ziel pro Satz. Vorgeschlagen ist dein aktueller Plan-Stand."));
  const conf = S.custom || {}; const box = el("div", "builder");
  EX_ORDER.forEach(ex => {
    const c = conf[ex] || { on: false, sets: 3, reps: targets(ex)[0] };
    const row = el("div", "brow" + (c.on ? " on" : "")); row.style.setProperty("--k", cv(EX[ex].color));
    row.innerHTML = illo(EX[ex].pose, EX[ex].color, 54);
    const mid = el("div"); mid.append(el("div", "", EX[ex].name, "font-weight:600"));
    const ctl = el("div", "ctl");
    const sets = document.createElement("select"); sets.setAttribute("aria-label", EX[ex].name + " Sätze");
    [1, 2, 3, 4, 5, 6].forEach(n => { const o = document.createElement("option"); o.value = n; o.textContent = n; if (n === c.sets) o.selected = true; sets.append(o); });
    const reps = document.createElement("input"); reps.type = "number"; reps.inputMode = "numeric"; reps.min = 1; reps.value = c.reps; reps.setAttribute("aria-label", EX[ex].name + " Ziel");
    ctl.append(sets, el("span", "", "×"), reps, el("span", "", EX[ex].unit === "s" ? "s" : "Wdh"));
    mid.append(ctl);
    const tog = el("button", "chip", c.on ? "Dabei" : "Aus"); tog.setAttribute("aria-pressed", String(c.on));
    tog.addEventListener("click", () => { c.on = !c.on; tog.textContent = c.on ? "Dabei" : "Aus"; tog.setAttribute("aria-pressed", String(c.on)); row.classList.toggle("on", c.on); });
    sets.addEventListener("change", () => c.sets = Number(sets.value));
    reps.addEventListener("change", () => c.reps = Math.max(1, Math.round(Number(reps.value)) || 1));
    row.append(mid, tog); box.append(row); conf[ex] = c;
  });
  st.append(box);
  ac.append(btn("Los geht's", "main", () => {
    const chosen = EX_ORDER.filter(ex => conf[ex].on); if (!chosen.length) return;
    S.custom = conf; save();
    const steps = [];
    chosen.forEach((ex, bi) => {
      for (let i = 1; i <= conf[ex].sets; i++) {
        steps.push({ k: "set", ex, target: conf[ex].reps, last: i === conf[ex].sets, idx: i, of: conf[ex].sets });
        if (i < conf[ex].sets) steps.push({ k: "rest", sec: restFor(i, conf[ex].sets), next: EX[ex].name + " · Satz " + (i + 1) });
      }
      if (bi < chosen.length - 1) steps.push({ k: "rest", sec: 90, next: EX[chosen[bi + 1]].name });
    });
    steps.push({ k: "done" });
    R.steps.splice(R.i + 1, R.steps.length, ...steps); next();
  }, "--c-free"));
}

/* ===================== Bewegungssensor =====================
   Squats: Betrag der Beschleunigung minus Ruhewert. Ganz unten bremst du ab und drückst hoch,
   das gibt pro Kniebeuge eine deutliche Spitze. Situps: Neigung gegenüber der Liegeposition. */
let sm = null;
function startMotion(mode, sens, fill, onRep) { sm = { mode, sens, fill, onRep, g: null, base: null, f: 0, up: false, last: 0, ref: null, armed: false, seen: false }; }
function motionArm() { if (!sm) return; sm.armed = true; if (sm.mode === "tilt") sm.ref = sm.g ? sm.g.slice() : null; }
function stopMotion() { sm = null; }
function onMotion(ev) {
  if (!sm) return;
  const a = ev.accelerationIncludingGravity; if (!a || a.x == null) return;
  sm.seen = true;
  const v = [a.x, a.y, a.z];
  if (!sm.g) sm.g = v.slice();
  for (let i = 0; i < 3; i++) sm.g[i] = sm.g[i] * 0.9 + v[i] * 0.1;
  const now = performance.now();
  if (sm.mode === "lift") {
    const mag = Math.hypot(v[0], v[1], v[2]);
    sm.base = sm.base == null ? mag : sm.base * 0.995 + mag * 0.005;
    sm.f = sm.f * 0.6 + (mag - sm.base) * 0.4;
    const thr = 3.4 - sm.sens * 0.25;
    if (sm.fill) sm.fill.style.width = Math.max(0, Math.min(100, sm.f / thr * 50)) + "%";
    if (!sm.armed) return;
    if (!sm.up && sm.f > thr && now - sm.last > 900) { sm.up = true; sm.last = now; sm.onRep(); }
    else if (sm.up && sm.f < thr * 0.25) sm.up = false;
  } else {
    if (!sm.armed || !sm.ref) { if (sm.fill) sm.fill.style.width = "0%"; return; }
    const g = sm.g, r = sm.ref;
    const c = (g[0] * r[0] + g[1] * r[1] + g[2] * r[2]) / ((Math.hypot(...g) * Math.hypot(...r)) || 1);
    const ang = Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
    const thr = 70 - sm.sens * 4;
    if (sm.fill) sm.fill.style.width = Math.max(0, Math.min(100, ang / thr * 50)) + "%";
    if (!sm.up && ang > thr && now - sm.last > 900) { sm.up = true; sm.last = now; sm.onRep(); }
    else if (sm.up && ang < thr * 0.4) sm.up = false;
  }
}

if (S.setup.done && !S.badgesSeen) newAchievements();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
render();
})();
</script>

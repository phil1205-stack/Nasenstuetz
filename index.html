<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasenstütz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nasenstütz">
<meta name="theme-color" content="#10161E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: Trainingsbuch. Oben Wochenleiste, dann "Heute" als Satzkarte, weitere Trainings, Fortschritt, Einstellungen.
   Jede Übung hat ihre eigene Farbe wie Hallenmarkierungen. Training läuft als Vollbild-Ablauf. */
:root {
  --bg: #EEF1F5; --surface: #FFFFFF; --sunk: #E3E8EE; --ink: #121A24; --muted: #5A6676; --line: #D6DCE4;
  --c-push: #E24A14; --c-squat: #1B74C9; --c-situp: #B88900; --c-plank: #6B4FD6; --c-stretch: #18865F; --c-band: #C62A60; --c-free: #3B4756;
  --good: #18865F; --on-color: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161E; --surface: #18212C; --sunk: #0B1016; --ink: #E8EDF3; --muted: #8E9BAA; --line: #263241;
    --c-push: #FF6B33; --c-squat: #4DA3F5; --c-situp: #F0C23A; --c-plank: #9A82FF; --c-stretch: #3CC892; --c-band: #F25C91; --c-free: #A9B6C4;
    --good: #3CC892; --on-color: #0B1016; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 36px) max(16px, env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
main { max-width: 480px; margin: 0 auto; display: grid; gap: 26px; }
h1, h2, h3 { margin: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--c-push); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

/* Wochenleiste */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; padding: 8px 0 9px; border-radius: 10px; }
.wd .d { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.wd .n { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1; }
.wd .m { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid transparent; }
.wd.plan .m { border-color: var(--muted); }
.wd.done .m { background: var(--good); border-color: var(--good); }
.wd.today { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }

/* Heute */
.today-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 16px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.blocks { display: grid; gap: 12px; }
.block { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.badge { width: 44px; height: 44px; border-radius: 12px; display: grid; place-content: center; font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--on-color); }
.block .name { font-weight: 600; }
.reps { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.reps .x { color: var(--muted); font-weight: 500; }
.go { width: 100%; padding: 17px; border-radius: 14px; background: var(--ink); color: var(--bg); font-family: var(--display); font-weight: 800; font-size: 23px; letter-spacing: .05em; text-transform: uppercase; }
.go.alt { background: var(--sunk); color: var(--ink); font-size: 18px; padding: 13px; }
.done-note { display: flex; gap: 10px; align-items: center; color: var(--good); font-weight: 600; }

/* Weitere Trainings */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; align-content: start; min-height: 104px; }
.tile .k { display: flex; justify-content: space-between; align-items: center; }
.tile .dot { width: 10px; height: 10px; border-radius: 3px; }
.tile b { font-family: var(--display); font-size: 19px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }

/* Fortschritt */
.prog { display: grid; gap: 2px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.prow { background: var(--surface); display: grid; grid-template-columns: 1fr auto 92px; gap: 12px; align-items: center; padding: 12px 14px; }
.prow .lvl { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.prow .delta { font-size: 12px; color: var(--good); font-weight: 600; }
.spark { width: 92px; height: 30px; }

/* Einstellungen & Formulare */
details.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
details.box summary { cursor: pointer; font-weight: 600; }
.fieldset { display: grid; gap: 10px; margin-top: 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); }
.opt[aria-checked="true"] { border-color: var(--ink); }
.opt .r { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 2px; }
.opt[aria-checked="true"] .r { border: 6px solid var(--ink); }
.opt b { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row input[type=number], .row select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.row input[type=number] { width: 84px; text-align: right; }
.row input[type=range] { width: 150px; accent-color: var(--ink); }
.linkbtn { color: var(--muted); text-decoration: underline; font-size: 13px; padding: 0; justify-self: start; }

/* Einstufung */
.setup { display: grid; gap: 18px; }
.intro { display: grid; gap: 8px; }
.intro h2 { font-size: 34px; line-height: 1; }
.test-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.test-row:last-child { border-bottom: 0; }
.test-row .ctl { display: flex; gap: 6px; align-items: center; }
.test-row input { width: 64px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: right; }
.btn-s { padding: 8px 12px; border-radius: 8px; background: var(--sunk); font-weight: 600; font-size: 13px; }

/* Ablauf (Vollbild) */
#run {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); touch-action: manipulation; user-select: none; -webkit-user-select: none;
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
}
#run .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#run .track { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
#run .track i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s; }
.stage { display: grid; align-content: center; justify-items: center; text-align: center; gap: 10px; min-height: 0; }
.stage .what { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.stage .big { font-family: var(--display); font-weight: 800; font-size: min(40vw, 260px); line-height: .85; font-variant-numeric: tabular-nums; }
.stage .big.pop { animation: pop .18s ease-out; }
.stage .goal { font-size: 16px; font-weight: 600; }
.stage .cue { max-width: 34ch; color: var(--muted); font-size: 14px; }
.stage .status { min-height: 22px; color: var(--muted); }
@keyframes pop { from { transform: scale(1.08); } to { transform: scale(1); } }
.meter { width: min(320px, 100%); display: grid; gap: 6px; }
.meter .t { position: relative; height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.meter .f { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .08s linear; }
.meter .th { position: absolute; top: 0; bottom: 0; width: 3px; left: 50%; background: var(--ink); }
.meter .c { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 10px; }
.actions button { flex: 1; padding: 15px; border-radius: 13px; font-weight: 700; font-size: 16px; background: var(--surface); border: 1px solid var(--line); }
.actions button.main { color: var(--on-color); border-color: transparent; font-family: var(--display); font-size: 21px; letter-spacing: .05em; text-transform: uppercase; }
.feel { display: grid; gap: 10px; width: min(340px, 100%); }
.feel button { padding: 15px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; text-align: left; }
.feel button small { display: block; color: var(--muted); font-weight: 400; }
.summary { width: min(360px, 100%); display: grid; gap: 8px; text-align: left; }
.summary div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.btn-x { padding: 8px 12px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
/* Statistik */
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { padding: 8px 2px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.kpi b { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kpi span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 8px; display: grid; gap: 6px; }
.cols { display: grid; gap: 3px; align-items: end; height: 120px; }
.cols .c { display: flex; flex-direction: column-reverse; height: 100%; min-width: 0; }
.cols .c i { display: block; width: 100%; }
.cols .c i:last-child { border-radius: 3px 3px 0 0; }
.cols .c.empty::before { content: ""; display: block; height: 2px; background: var(--line); }
.xl { display: grid; gap: 3px; font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--k); }
.streak { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.streak .flame { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; color: var(--c-push); font-variant-numeric: tabular-nums; }
.flex-in { display: flex; gap: 8px; align-items: center; }
.flex-in input { width: 76px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: right; }
#fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .stage .big.pop { animation: none; } #run .track i { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="run" hidden>
  <div class="bar"><button class="btn-x" id="rQuit">Beenden</button><span class="label" id="rTitle"></span><span class="label" id="rStep"></span></div>
  <div class="track"><i id="rTrack"></i></div>
  <div class="stage" id="rStage"></div>
  <div class="actions" id="rActions"></div>
</div>
<canvas id="fx" hidden></canvas>

<script>
(function () {
"use strict";

/* ===================== Inhalte ===================== */
const EX = {
  push:  { name: "Liegestütze", tag: "LS", color: "--c-push",  mode: "tap",   unit: "",  f: [.5, .6, .5, .5, .6], step: 1,
           cue: "Körper bildet eine gerade Linie, Ellbogen etwa 45 Grad vom Körper. Handy unter die Brust, gern erhöht auf ein Buch, und bei jeder Wiederholung mit der Nase antippen.",
           testQ: "Wie viele saubere Liegestütze schaffst du am Stück?" },
  squat: { name: "Squats",      tag: "SQ", color: "--c-squat", mode: "lift",  unit: "",  f: [.6, .7, .6, .7],     step: 1,
           cue: "Handy vor der Brust halten. Füße schulterbreit, Knie folgen den Zehen, Gewicht auf den Fersen. Mindestens bis die Oberschenkel waagerecht sind.",
           testQ: "Wie viele Kniebeugen schaffst du am Stück?" },
  situp: { name: "Situps",      tag: "SU", color: "--c-situp", mode: "tilt",  unit: "",  f: [.6, .7, .6, .7],     step: 1,
           cue: "Handy flach auf die Brust, Arme darüber verschränken. Füße am Boden, Kinn leicht zur Brust, langsam wieder abrollen.",
           testQ: "Wie viele Situps schaffst du am Stück?" },
  plank: { name: "Plank",       tag: "PL", color: "--c-plank", mode: "timer", unit: "s", f: [.6, .7, .8],         step: 3,
           cue: "Ellbogen unter den Schultern, Bauch und Po fest, Hüfte weder hängen lassen noch hochschieben. Ruhig weiteratmen.",
           testQ: "Wie viele Sekunden hältst du den Plank?" }
};
const EX_ORDER = ["push", "squat", "situp", "plank"];

const CYCLES = {
  full:  { name: "Ganzkörper", desc: "Alle vier Übungen an 3 festen Tagen pro Woche. Dazwischen erholt sich der Körper.", days: true },
  split: { name: "Zwei Hälften", desc: "Abwechselnd Liegestütze mit Plank und Squats mit Situps, an 4 Tagen. Kürzere Einheiten.", days: true },
  daily: { name: "Jeden Tag kurz", desc: "Täglich zwei Übungen im Wechsel, mit etwas weniger Wiederholungen. Gut für die Routine.", days: false }
};
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

const ROUTINES = {
  evening: { name: "Abends dehnen", color: "--c-stretch", kind: "stretch", min: 8, items: [
    ["Nacken seitlich", "Ohr Richtung Schulter sinken lassen, die andere Schulter bleibt unten.", 30, true],
    ["Brust am Türrahmen", "Unterarm an den Rahmen, Schritt nach vorn, bis es in der Brust zieht.", 30, false],
    ["Trizeps über Kopf", "Hand zwischen die Schulterblätter, mit der anderen Hand den Ellbogen sanft ziehen.", 30, true],
    ["Hüftbeuger im Ausfallschritt", "Hinteres Knie am Boden, Becken nach vorn schieben, Oberkörper aufrecht.", 30, true],
    ["Beinrückseite im Sitzen", "Beine gestreckt, mit geradem Rücken aus der Hüfte nach vorn neigen.", 30, false],
    ["Gesäß liegend", "Rückenlage, Knöchel auf das andere Knie legen und das untere Bein zur Brust ziehen.", 30, true],
    ["Kindhaltung", "Auf die Fersen setzen, Arme lang nach vorn, Stirn Richtung Boden.", 40, false],
    ["Drehung im Liegen", "Rückenlage, Knie zu einer Seite fallen lassen, Blick zur anderen Seite.", 30, true]
  ]},
  after: { name: "Nach dem Training", color: "--c-stretch", kind: "stretch", min: 5, items: [
    ["Brust am Türrahmen", "Unterarm an den Rahmen, langsam nach vorn lehnen.", 30, false],
    ["Schulter quer", "Arm gestreckt vor der Brust, mit dem anderen Arm heranziehen.", 25, true],
    ["Oberschenkel vorn", "Im Stand den Fuß zum Po ziehen, Knie zeigen nach unten.", 25, true],
    ["Wade an der Wand", "Hände an die Wand, hinteres Bein gestreckt, Ferse am Boden.", 25, true],
    ["Bauch: Kobra", "Bauchlage, mit den Händen den Oberkörper sanft aufrichten, Hüfte bleibt liegen.", 30, false]
  ]},
  morning: { name: "Morgens mobil", color: "--c-stretch", kind: "stretch", min: 5, items: [
    ["Armkreisen", "Große, langsame Kreise, nach der Hälfte die Richtung wechseln.", 30, false],
    ["Katze und Kuh", "Vierfüßlerstand, im Wechsel Rücken rund machen und durchhängen lassen.", 40, false],
    ["Hüftkreisen", "Hände an die Hüfte, große Kreise in beide Richtungen.", 30, false],
    ["Ausfallschritt mit Drehung", "Tiefer Ausfallschritt, Hand innen am Boden, anderen Arm zur Decke drehen.", 30, true],
    ["Tiefe Hocke halten", "So tief wie bequem hocken, Ellbogen schieben die Knie sanft nach außen.", 40, false]
  ]},
  bandFull: { name: "Band Ganzkörper", color: "--c-band", kind: "band", min: 20, rounds: 3, items: [
    ["Rudern im Sitzen", "Band um die Füße, Ellbogen nah am Körper nach hinten ziehen, Schulterblätter zusammen.", 12],
    ["Band auseinanderziehen", "Arme gestreckt auf Brusthöhe, Band zur Brust hin auseinanderziehen.", 15],
    ["Schulterdrücken", "Auf das Band stellen, Griffe von Schulterhöhe nach oben drücken.", 10],
    ["Bizepscurl", "Auf das Band stellen, Ellbogen fest am Körper, Hände zur Schulter.", 12],
    ["Kniebeuge mit Band", "Auf das Band stellen, Griffe an den Schultern halten, tief gehen.", 15],
    ["Hüftheben mit Band", "Band über den Knien, Rückenlage, Hüfte hoch und Knie leicht nach außen drücken.", 15]
  ]},
  bandPosture: { name: "Band Haltung", color: "--c-band", kind: "band", min: 10, rounds: 2, items: [
    ["Face Pulls", "Band auf Kopfhöhe befestigen, zum Gesicht ziehen, Ellbogen hoch und weit.", 15],
    ["Band auseinanderziehen", "Arme gestreckt, langsam auseinander, kurz halten.", 15],
    ["Außenrotation", "Ellbogen am Körper, 90 Grad gebeugt, Unterarme nach außen drehen.", 12],
    ["Band über Kopf nach hinten", "Band breit greifen, Arme gestreckt über den Kopf und hinter den Körper führen.", 10]
  ]}
};

/* ===================== Zustand ===================== */
const LS = "nasenstuetz-v3";
const $ = s => document.querySelector(s);
const dkey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayKey = () => dkey(new Date());

function fresh() {
  const prog = {}; for (const e of EX_ORDER) prog[e] = { tm: 0, sessions: 0, miss: 0, testAt: 0, hist: [], sens: 5 };
  return { v: 3, setup: { done: false, cycle: "full", days: [1, 3, 5], band: false, rest: 60, time: "18:30", stretchGoal: 4 }, prog, log: {}, draft: {}, flex: [] };
}
let S = fresh();
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s && s.v === 3) S = Object.assign(fresh(), s); } catch (e) {}
S.setup = Object.assign(fresh().setup, S.setup); if (!Array.isArray(S.flex)) S.flex = [];
for (const e of EX_ORDER) S.prog[e] = Object.assign({ tm: 0, sessions: 0, miss: 0, testAt: 0, hist: [], sens: 5 }, S.prog[e] || {});
// alte Daten übernehmen (Version 1 und 2)
try {
  if (!Object.keys(S.log).length) {
    const v2 = JSON.parse(localStorage.getItem("nasenstuetz-v2") || "null");
    const v1 = JSON.parse(localStorage.getItem("nasenstuetz-v1") || "null");
    const add = (ex, days) => { for (const [k, d] of Object.entries(days || {})) if (d.sets && d.sets.length) logAdd(k, { type: ex, mode: "free", sets: d.sets.slice() }); };
    if (v2 && v2.ex) for (const ex of EX_ORDER) add(ex, v2.ex[ex] && v2.ex[ex].days);
    else if (v1 && v1.days) add("push", v1.days);
  }
} catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function logAdd(k, item) { (S.log[k] = S.log[k] || { items: [] }).items.push(item); }

/* ===================== Plan-Logik ===================== */
function isPlanDay(d) { return S.setup.cycle === "daily" || S.setup.days.includes(d.getDay()); }
function hasProgram(k) { return !!(S.log[k] && S.log[k].items.some(i => i.mode === "plan" || i.mode === "mini")); }
function hasStretch(k) { return !!(S.log[k] && S.log[k].items.some(i => i.mode === "routine" && ROUTINES[i.type] && ROUTINES[i.type].kind === "stretch")); }
function monday(d) { const m = new Date(d); m.setHours(12, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
function weekStats(mon) {
  let done = 0, plan = 0, stretch = 0;
  for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); if (isPlanDay(d)) plan++; const k = dkey(d); if (hasProgram(k)) done++; if (hasStretch(k)) stretch++; }
  if (S.setup.cycle === "daily") plan = 5;

}
function weekStreak() {
  let n = 0; const m = monday(new Date());

}
function programDaysBefore(k) { return Object.keys(S.log).filter(x => x < k && hasProgram(x)).length; }
function exercisesFor(d) {
  const c = S.setup.cycle, k = dkey(d), n = programDaysBefore(k);
  if (c === "full") return EX_ORDER.slice();
  if (c === "split") return n % 2 === 0 ? ["push", "plank"] : ["squat", "situp"];
  return n % 2 === 0 ? ["push", "situp"] : ["squat", "plank"];
}
function targets(ex) {
  const p = S.prog[ex], D = EX[ex], scale = S.setup.cycle === "daily" ? .85 : 1;
  const min = ex === "plank" ? 10 : 1;

function testDue(ex) { const p = S.prog[ex]; return p.sessions > 0 && p.sessions % 8 === 0 && p.testAt !== p.sessions; }
function applyProgress(ex, sets, tg, feel) {
  const p = S.prog[ex], met = sets.length === tg.length && sets.every((s, i) => s >= tg[i]);
  const old = p.tm;
  let f = 1;
  if (met) f = feel === "easy" ? 1.10 : feel === "hard" ? 1.02 : 1.06;
  else f = p.miss >= 1 ? 0.95 : 1;
  p.miss = met ? 0 : p.miss + 1;
  let nt = old * f;
  if (f > 1) nt = Math.max(nt, old + EX[ex].step);
  p.tm = Math.round(nt * 10) / 10; p.sessions++;
  p.hist.push([todayKey(), Math.round(p.tm)]); if (p.hist.length > 60) p.hist.shift();
}
function applyTest(ex, val) {
  const p = S.prog[ex]; p.tm = Math.max(ex === "plank" ? 15 : 2, val); p.testAt = p.sessions; p.miss = 0;
  p.hist.push([todayKey(), Math.round(p.tm)]); if (p.hist.length > 60) p.hist.shift();
}
const fmt = (ex, v) => EX[ex] && EX[ex].unit === "s" ? (v >= 60 ? Math.floor(v / 60) + ":" + String(v % 60).padStart(2, "0") : v + "s") : String(v);
const cv = name => `var(${name})`;

/* ===================== Ansichten ===================== */
function weekStrip() {

  let h = '<div class="week">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i); const k = dkey(d);
    const cls = ["wd", isPlanDay(d) ? "plan" : "", hasProgram(k) ? "done" : "", k === todayKey() ? "today" : ""].join(" ");
    h += `<div class="${cls}"><span class="d">${WD[d.getDay()]}</span><span class="n">${d.getDate()}</span><span class="m"></span></div>`;

/* ---------- Statistik ---------- */
let statPeriod = "week";
const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
function aggregate(keys) {
  const a = { push: 0, squat: 0, situp: 0, plank: 0, days: 0, stretch: 0, band: 0, best: {} };
  for (const k of keys) {
    const d = S.log[k]; if (!d) continue;
    if (hasProgram(k)) a.days++;
    for (const it of d.items) {
      if (EX[it.type]) { const s = it.sets.reduce((x, y) => x + y, 0); a[it.type] += s; a.best[it.type] = Math.max(a.best[it.type] || 0, ...it.sets); }
      else if (it.mode === "routine") { if (ROUTINES[it.type] && ROUTINES[it.type].kind === "band") a.band += it.min; else a.stretch += it.min; }
    }

}
function keysBetween(from, to) { // inklusive, Date-Objekte
  const out = [], d = new Date(from); d.setHours(12, 0, 0, 0); const end = new Date(to); end.setHours(12, 0, 0, 0);
  while (d <= end) { out.push(dkey(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function statBuckets() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if (statPeriod === "day") return { buckets: [{ l: "Heute", keys: [todayKey()] }], all: [todayKey()] };
  if (statPeriod === "week") {
    const mon = monday(now), b = [];
    for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); b.push({ l: WD[d.getDay()], keys: [dkey(d)] }); }
    return { buckets: b, all: b.flatMap(x => x.keys) };
  }
  if (statPeriod === "month") {
    const n = new Date(y, m + 1, 0).getDate(), b = [];
    for (let i = 1; i <= n; i++) b.push({ l: (i === 1 || i % 5 === 0) ? String(i) : "", keys: [dkey(new Date(y, m, i))] });
    return { buckets: b, all: b.flatMap(x => x.keys) };

  if (statPeriod === "year") {
    const b = MON.map((l, i) => ({ l: l.slice(0, 1), keys: keysBetween(new Date(y, i, 1), new Date(y, i + 1, 0)) }));
    return { buckets: b, all: b.flatMap(x => x.keys) };

  const ks = Object.keys(S.log).sort(); const first = ks.length ? new Date(ks[0] + "T12:00") : now;
  const b = []; let cy = first.getFullYear(), cm = first.getMonth();
  while (cy < y || (cy === y && cm <= m)) { b.push({ l: MON[cm].slice(0, 1), keys: keysBetween(new Date(cy, cm, 1), new Date(cy, cm + 1, 0)) }); cm++; if (cm > 11) { cm = 0; cy++; } }
  const last = b.slice(-24);
  return { buckets: last, all: Object.keys(S.log) };
}
function statsHTML() {
  const names = { day: "Tag", week: "Woche", month: "Monat", year: "Jahr", all: "Gesamt" };
  const { buckets, all } = statBuckets(), a = aggregate(all);
  const seg = `<div class="seg" role="tablist">${Object.entries(names).map(([id, n]) => `<button role="tab" aria-selected="${statPeriod === id}" data-period="${id}">${n}</button>`).join("")}</div>`;
  const kp = (v, l, c) => `<div class="kpi"><b style="${c ? "color:" + cv(c) : ""}">${v}</b><span>${l}</span></div>`;
  const plank = a.plank >= 60 ? Math.floor(a.plank / 60) + ":" + String(a.plank % 60).padStart(2, "0") : a.plank + "s";
  const kpis = `<div class="kpis">${kp(a.push, "Liegestütze", "--c-push")}${kp(a.squat, "Squats", "--c-squat")}${kp(a.situp, "Situps", "--c-situp")}${kp(plank, "Plank", "--c-plank")}${kp(a.stretch + a.band, "Min Dehnen/Band", "--c-stretch")}${kp(a.days, "Trainingstage")}</div>`;
  let chart = "";
  if (buckets.length > 1) {
    const vals = buckets.map(b => { const x = aggregate(b.keys); return [x.push, x.squat, x.situp]; });
    const max = Math.max(1, ...vals.map(v => v[0] + v[1] + v[2]));
    const tpl = `grid-template-columns:repeat(${buckets.length},minmax(0,1fr))`;
    const cols = vals.map(v => { const t = v[0] + v[1] + v[2]; if (!t) return `<div class="c empty"></div>`;
      return `<div class="c">${["--c-push", "--c-squat", "--c-situp"].map((c, i) => v[i] ? `<i style="height:${v[i] / max * 100}%;background:${cv(c)}"></i>` : "").join("")}</div>`; }).join("");
    chart = `<div class="chart"><div class="cols" style="${tpl}">${cols}</div><div class="xl" style="${tpl}">${buckets.map(b => `<span>${b.l}</span>`).join("")}</div>
      <div class="legend"><span style="--k:var(--c-push)">Liegestütze</span><span style="--k:var(--c-squat)">Squats</span><span style="--k:var(--c-situp)">Situps</span></div></div>`;

/* ---------- Feier-Animation ---------- */
function celebrate(big) {

  const c = $("#fx"), ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  c.hidden = false; c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--c-push", "--c-squat", "--c-situp", "--c-plank", "--c-stretch", "--c-band"].map(v => cs.getPropertyValue(v).trim());
  const n = big ? 160 : 60, P = [];
  for (let i = 0; i < n; i++) {
    const fromSide = big && i % 2;
    P.push({ x: big ? (fromSide ? innerWidth + 10 : -10) : innerWidth / 2, y: big ? innerHeight * .75 : innerHeight * .45,
      vx: big ? (fromSide ? -1 : 1) * (4 + Math.random() * 9) : (Math.random() - .5) * 12, vy: -(big ? 9 + Math.random() * 10 : 5 + Math.random() * 9),
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, c: cols[i % cols.length] });
  }
  const t0 = performance.now(), dur = big ? 2800 : 1600;
  (function frame(t) {
    const e = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - e / dur); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (e < dur) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}
function blockHTML(ex) {
  const D = EX[ex];

  const t = targets(ex);
  const reps = t.map((v, i) => `<span>${fmt(ex, v)}${i === t.length - 1 ? "+" : ""}</span>`).join('<span class="x">·</span>');
  return `<div class="block"><div class="badge" style="background:${cv(D.color)}">${D.tag}</div><div><div class="name">${D.name}</div><div class="reps" style="color:${cv(D.color)}">${reps}</div></div></div>`;
}

let forceToday = false;

      <div class="lvl" style="color:var(--c-stretch)">${flexLast ? (flexLast[1] > 0 ? "+" : "") + flexLast[1] : "–"}</div>${spark(S.flex, "--c-stretch")}</div></div>

function spark(hist, color) {
  const pts = hist.slice(-20);
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 92 30" aria-hidden="true"><line x1="2" y1="26" x2="90" y2="26" stroke="var(--line)" stroke-width="2" fill="none"/></svg>`;
  const vals = pts.map(p => p[1]), lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const xy = vals.map((v, i) => [2 + i * 88 / (vals.length - 1), 26 - (v - lo) / r * 22]);
  const line = xy.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 92 30" aria-hidden="true"><polyline points="2,28 ${line} 90,28" fill="${cv(color)}" fill-opacity=".14" stroke="none"/><polyline points="${line}" fill="none" stroke="${cv(color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${cv(color)}"/></svg>`;
}

}

function settingsHTML() {

    <p class="small" id="dayHint"></p></div>

function dayHintText() {
  if (S.setup.cycle === "daily") return "";
  const want = S.setup.cycle === "full" ? 3 : 4, have = S.setup.days.length;
  const sorted = S.setup.days.slice().sort(), back2back = sorted.some((d, i) => sorted.includes((d + 1) % 7));
  let t = `Empfohlen: ${want} Tage. Gewählt: ${have}.`;
  if (S.setup.cycle === "full" && back2back) t += " Besser mit einem Ruhetag dazwischen.";
  return t;
}
function bindRhythm() {
  document.querySelectorAll("[data-cycle]").forEach(b => b.addEventListener("click", () => {
    S.setup.cycle = b.dataset.cycle;
    if (b.dataset.cycle === "split" && S.setup.days.length < 4) S.setup.days = [1, 2, 4, 5];
    if (b.dataset.cycle === "full" && S.setup.days.length !== 3) S.setup.days = [1, 3, 5];
    save(); render();
  }));
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    const d = Number(b.dataset.day), i = S.setup.days.indexOf(d);
    if (i >= 0) { if (S.setup.days.length > 1) S.setup.days.splice(i, 1); } else S.setup.days.push(d);
    save(); render();
  }));
  const h = $("#dayHint"); if (h) h.textContent = dayHintText();
}

/* ===================== Abläufe bauen ===================== */
function startToday() {
  const exs = exercisesFor(new Date()), steps = [];
  exs.forEach((ex, bi) => {
    if (testDue(ex)) { steps.push({ k: "set", ex, test: true, target: 0, last: true, idx: 1, of: 1 }); }
    else {
      const t = targets(ex);
      t.forEach((v, i) => {
        steps.push({ k: "set", ex, target: v, last: i === t.length - 1, idx: i + 1, of: t.length });
        if (i < t.length - 1) steps.push({ k: "rest", sec: S.setup.rest, next: EX[ex].name + " · Satz " + (i + 2) });
      });
      steps.push({ k: "feel", ex, targets: t });
    }
    if (bi < exs.length - 1) steps.push({ k: "rest", sec: Math.max(60, S.setup.rest), next: EX[exs[bi + 1]].name });
  });
  steps.push({ k: "done" });
  startRun("Plan-Training", steps, { kind: "plan" });
}
function startRoutine(id) {
  const r = ROUTINES[id], steps = [];
  if (r.kind === "stretch") {
    r.items.forEach(([n, cue, sec, sides]) => {
      if (sides) { steps.push({ k: "timed", name: n + " · links", cue, sec, color: r.color }); steps.push({ k: "timed", name: n + " · rechts", cue, sec, color: r.color }); }
      else steps.push({ k: "timed", name: n, cue, sec, color: r.color });
    });
  } else {
    for (let round = 1; round <= r.rounds; round++) {
      r.items.forEach(([n, cue, reps], i) => {
        steps.push({ k: "reps", name: n, cue, reps, color: r.color, round, rounds: r.rounds });
        if (i < r.items.length - 1) steps.push({ k: "rest", sec: 20, next: r.items[i + 1][0] });
      });
      if (round < r.rounds) steps.push({ k: "rest", sec: 60, next: "Runde " + (round + 1) });
    }
  }
  steps.push({ k: "done" });
  startRun(r.name, steps, { kind: "routine", id, min: r.min });
}
function startFree() {
  const steps = [{ k: "pick" }];

}

/* ===================== Ablauf-Motor ===================== */
let R = null;
let audio = null, wakeLock = null, timers = [];
function beep(freq, len, vol) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o = audio.createOscillator(), g = audio.createGain(), l = len || .12;
    o.frequency.value = freq || 880; g.gain.setValueAtTime(vol || .2, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + l);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + l + .01);
  } catch (e) {}
}
async function keepAwake() { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (R && document.visibilityState === "visible") keepAwake(); });
function clearTimers() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; }

async function needMotion(steps) {
  if (!steps.some(s => s.k === "set" && (EX[s.ex].mode === "lift" || EX[s.ex].mode === "tilt")) && !steps.some(s => s.k === "pick")) return true;
  if (typeof DeviceMotionEvent === "undefined") return true;
  if (typeof DeviceMotionEvent.requestPermission === "function") {
    try { const r = await DeviceMotionEvent.requestPermission(); return r === "granted" ? true : "denied"; }
    catch (e) { return "denied"; }
  }
  return true;
}

async function startRun(title, steps, meta) {
  const perm = await needMotion(steps);
  beep(880, .04, .05);
  R = { title, steps, i: 0, meta, res: {}, motionOK: perm === true };
  if (perm === true) window.addEventListener("devicemotion", onMotion);
  $("#rTitle").textContent = title;
  $("#run").hidden = false; document.body.style.overflow = "hidden";
  keepAwake();
  go(0);
}
function endRun(saveIt) {
  clearTimers(); stopMotion(); window.removeEventListener("devicemotion", onMotion);
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  if (saveIt !== false) commit(false);
  R = null; $("#run").hidden = true; document.body.style.overflow = ""; forceToday = false; render();
}
$("#rQuit").addEventListener("click", () => {
  if (!R) return;
  if (R.confirmQuit) { endRun(); return; }
  R.confirmQuit = true; $("#rQuit").textContent = "Wirklich?";
  timers.push(setTimeout(() => { if (R) { R.confirmQuit = false; $("#rQuit").textContent = "Beenden"; } }, 2500));
});

function commit(finished) {
  if (!R || R.committed) return;
  const k = todayKey(), m = R.meta;
  if (m.kind === "plan") {
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "plan", sets: r.sets.slice(), test: !!r.test });
  } else if (m.kind === "mini") {
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "mini", sets: r.sets.slice() });
  } else if (m.kind === "free") {
    for (const [ex, r] of Object.entries(R.res)) if (r.sets.length) logAdd(k, { type: ex, mode: "free", sets: r.sets.slice() });
  } else if (m.kind === "routine" && (finished || R.i > 2)) {
    logAdd(k, { type: m.id, mode: "routine", min: m.min });
  }
  R.committed = true; save();
}

function go(i) {
  clearTimers(); stopMotion();
  R.i = i; R.confirmQuit = false; $("#rQuit").textContent = "Beenden";
  const s = R.steps[i], total = R.steps.length;
  $("#rStep").textContent = (i + 1) + " / " + total;
  $("#rTrack").style.width = (i / Math.max(1, total - 1) * 100) + "%";
  const st = $("#rStage"), ac = $("#rActions");
  st.innerHTML = ""; ac.innerHTML = ""; st.onpointerdown = null;
  ({ set: stepSet, rest: stepRest, timed: stepTimed, reps: stepReps, feel: stepFeel, done: stepDone, pick: stepPick })[s.k](s, st, ac);
}
const next = () => { if (R) go(R.i + 1); };

function el(tag, cls, text, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (style) e.style.cssText = style; return e; }
function btn(text, cls, fn, color) { const b = el("button", cls || "", text); if (color) b.style.background = cv(color); b.addEventListener("click", fn); return b; }
function countdown(sec, statusEl, done) {
  let s = sec; statusEl.textContent = "Los in " + s + " …"; beep(600, .08);
  const t = setInterval(() => { s--; if (s > 0) { statusEl.textContent = "Los in " + s + " …"; beep(600, .08); } else { clearInterval(t); beep(1000, .2); done(); } }, 1000);
  timers.push(t);
}

/* ---------- Satz ---------- */
function stepSet(s, st, ac) {
  const D = EX[s.ex], col = D.color;
  let count = 0, armed = false, lastTap = 0, finished = false;
  st.append(el("div", "what", D.name + (s.test ? " · Test" : " · Satz " + s.idx + "/" + s.of), `color:${cv(col)}`));
  const big = el("div", "big", D.unit === "s" ? "0s" : "0", `color:${cv(col)}`); st.append(big);
  const goal = el("div", "goal", s.test ? (D.unit === "s" ? "So lange wie möglich halten" : "So viele wie sauber gehen") : !s.target ? "Ohne Ziel, einfach los" : (s.last ?"Mindestens " + fmt(s.ex, s.target) + ", gern mehr" : "Ziel " + fmt(s.ex, s.target)));
  st.append(goal);
  const status = el("div", "status"); st.append(status);
  let meterFill = null;
  if ((D.mode === "lift" || D.mode === "tilt") && R.motionOK) {
    const m = el("div", "meter"); m.innerHTML = '<div class="t"><div class="f"></div><div class="th"></div></div><div class="c"><span>Bewegung</span><span>Zählschwelle</span></div>';
    meterFill = m.querySelector(".f"); meterFill.style.background = cv(col); st.append(m);
  }
  st.append(el("div", "cue", D.cue));

  const set = (v, pop) => {
    count = Math.max(0, v); big.textContent = fmt(s.ex, count);
    if (pop) { big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop"); }
    if (!s.last && !s.test && count >= s.target && D.mode !== "timer" && !finished) { finished = true; beep(1300, .25); status.textContent = "Geschafft"; timers.push(setTimeout(finish, 1200)); }
  };
  const finish = () => {
    if (!R) return;
    const r = R.res[s.ex] = R.res[s.ex] || { sets: [] };
    if (s.test) {
      r.test = true; r.sets.push(count);
      if (R.meta.kind === "setup") { S.draft[s.ex] = String(count); save(); }
      else if (count > 0) { applyTest(s.ex, count); save(); }
    } else r.sets.push(count);
    if (R.meta.kind === "setup") { endRun(false); return; }
    next();
  };
  const minus = btn("−1", "", () => { finished = false; set(count - 1); });
  const done = btn(s.last || s.test ? "Fertig" : "Satz fertig", "main", finish, col);

  if (D.mode === "tap" || ((D.mode === "lift" || D.mode === "tilt") && !R.motionOK)) {
    armed = true;
    status.textContent = D.mode === "tap" ? "Tippen zählt. Der ganze Bildschirm ist Zählfläche." : "Bewegungssensor nicht erlaubt. Tippe pro Wiederholung irgendwo auf den Bildschirm.";
    st.onpointerdown = e => { if (!armed) return; const n = Date.now(); if (n - lastTap < 500) return; lastTap = n; set(count + 1, true); beep(); };

      }, 250));
    });

    ac.append(minus, done);
    startMotion(D.mode, S.prog[s.ex].sens, meterFill, () => { set(count + 1, true); beep(); });
    countdown(D.mode === "tilt" ? 5 : 3, status, () => { motionArm(); status.textContent = D.mode === "lift" ? "Zählt jede Kniebeuge" : "Zählt jedes Aufrichten"; });
    timers.push(setTimeout(() => { if (sm && !sm.seen) status.textContent = "Kein Sensorsignal. Zähle mit −1 / Tippen nach oder prüfe die Freigabe in Safari."; }, 6000));
    st.onpointerdown = e => { if (sm && !sm.seen) { const n = Date.now(); if (n - lastTap < 500) return; lastTap = n; set(count + 1, true); beep(); } };

}

/* ===================== Bewegungssensor =====================
   Squats: Betrag der Beschleunigung minus Ruhewert. Ganz unten bremst du ab und drückst hoch,
   das gibt pro Kniebeuge eine deutliche Spitze. Situps: Neigung gegenüber der Liegeposition. */
let sm = null;

    else if (sm.up && sm.f < thr * 0.25) sm.up = false;
  } else {
    if (!sm.armed || !sm.ref) { if (sm.fill) sm.fill.style.width = "0%"; return; }
    const g = sm.g, r = sm.ref;
    const c = (g[0] * r[0] + g[1] * r[1] + g[2] * r[2]) / ((Math.hypot(...g) * Math.hypot(...r)) || 1);
    const ang = Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
    const thr = 70 - sm.sens * 4;
    if (sm.fill) sm.fill.style.width = Math.max(0, Math.min(100, ang / thr * 50)) + "%";
    if (!sm.up && ang > thr && now - sm.last > 900) { sm.up = true; sm.last = now; sm.onRep(); }
    else if (sm.up && ang < thr * 0.4) sm.up = false;
  }
}

render();
})();
</script>
</body>
</html>
